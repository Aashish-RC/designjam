<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Grida Design-to-Code Studio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="studio-container">
      <header class="header">
        <div class="brand">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
          <span>Grida Code Studio</span>
          <span class="badge">COMPILER</span>
        </div>
      </header>

      <nav class="framework-nav">
        <button class="nav-btn active" data-framework="react-tailwind">React + Tailwind</button>
        <button class="nav-btn" data-framework="flutter">Flutter (Dart)</button>
        <button class="nav-btn" data-framework="svelte">Svelte 5</button>
      </nav>

      <div class="code-wrapper">
        <pre><code id="code-output">// Select any layer or artboard on the canvas to generate code...</code></pre>
      </div>

      <footer class="toolbar">
        <span class="node-info" id="node-info">Target: UserProfileCard (frame)</span>
        <button class="btn-copy" id="btn-copy">Copy Component Code</button>
      </footer>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
