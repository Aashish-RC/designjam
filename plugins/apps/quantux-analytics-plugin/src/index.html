<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quant-UX Usability Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="studio-container">
      <header class="header">
        <div class="brand">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20v-6M6 20V10M18 20V4"></path>
          </svg>
          <span>Quant-UX Analytics</span>
          <span class="badge">LAB</span>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab-btn active" data-tab="tab-heatmaps">Click Heatmaps</button>
        <button class="tab-btn" data-tab="tab-funnels">Journey Funnels</button>
        <button class="tab-btn" data-tab="tab-ab">A/B Testing</button>
      </nav>

      <!-- Tab 1: Heatmaps -->
      <div class="tab-content active" id="tab-heatmaps">
        <div class="metric-row">
          <div class="metric-box">
            <div class="metric-label">Total Clicks</div>
            <div class="metric-value val-blue" id="stat-total-clicks">142</div>
          </div>
          <div class="metric-box">
            <div class="metric-label">Dead Clicks</div>
            <div class="metric-value val-red" id="stat-dead-clicks">18%</div>
          </div>
          <div class="metric-box">
            <div class="metric-label">Avg Time</div>
            <div class="metric-value val-green">14.2s</div>
          </div>
        </div>

        <div class="preview-heatmap-frame" id="heatmap-preview-container">
          <!-- Heatmap preview rendered here -->
        </div>

        <button class="btn-action" id="btn-overlay-heatmap">Overlay Heatmap on Canvas</button>
      </div>

      <!-- Tab 2: Funnels -->
      <div class="tab-content" id="tab-funnels">
        <div class="card">
          <div class="card-title">
            <span>Onboarding Flow Funnel</span>
            <span class="val-green" id="funnel-overall-rate">61.5%</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px;" id="funnel-steps-container">
            <!-- Dynamic funnel steps -->
          </div>
        </div>
      </div>

      <!-- Tab 3: A/B Testing -->
      <div class="tab-content" id="tab-ab">
        <div class="metric-row">
          <div class="metric-box">
            <div class="metric-label">Variant A (Control)</div>
            <div class="metric-value val-amber" id="ab-rate-a">14.2%</div>
          </div>
          <div class="metric-box">
            <div class="metric-label">Variant B (Test)</div>
            <div class="metric-value val-green" id="ab-rate-b">21.8%</div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">Winner: <span class="val-green" id="ab-winner">Variant B (+53.5%)</span></div>
          <p style="color: var(--text-secondary); font-size: 11px;">Statistically significant (95% confidence). Variant B demonstrated faster CTA clicks and 35% lower bounce rate.</p>
        </div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
